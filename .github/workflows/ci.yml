name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder secrets for build only — never use in real environments
  NODE_ENV: production
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  AUTH_SECRET: ci-build-only-auth-secret-not-for-production
  CRON_SECRET: ci-build-only-cron-secret-not-for-production
  CMS_API_KEY: ci-build-only-cms-key-not-for-production
  REVALIDATE_SECRET: ci-build-only-revalidate-secret
  SECRETS_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  AUTH_URL: http://localhost:3000/admin/api/auth
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3000/admin
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  ADMIN_INTERNAL_URL: http://127.0.0.1:3001

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      # next-env.d.ts imports route types that only `next dev` generates
      - name: Stub Next dev route types
        run: |
          for app in apps/web apps/admin; do
            mkdir -p "$app/.next/dev/types"
            printf 'export {}\n' > "$app/.next/dev/types/routes.d.ts"
            printf 'export {}\n' > "$app/.next/dev/types/root-params.d.ts"
          done

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Next build workers load .env from the app directory; job env alone is not enough for Prisma.
      - name: Write app env files for build
        run: |
          umask 077
          printf '%s\n' \
            "DATABASE_URL=${DATABASE_URL}" \
            "AUTH_SECRET=${AUTH_SECRET}" \
            "CRON_SECRET=${CRON_SECRET}" \
            "CMS_API_KEY=${CMS_API_KEY}" \
            "REVALIDATE_SECRET=${REVALIDATE_SECRET}" \
            "SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}" \
            "AUTH_URL=${AUTH_URL}" \
            "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            "NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL}" \
            "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            "ADMIN_INTERNAL_URL=${ADMIN_INTERNAL_URL}" \
            | tee .env apps/web/.env apps/admin/.env apps/cms/.env >/dev/null

      - name: Build
        run: pnpm build
